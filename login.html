<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Login | RiwiFlow</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .input-focus-ring:focus {
        outline: none;
        border-color: #5300b7;
        box-shadow: 0 0 0 2px #ebddff;
      }
    </style>
  </head>

  <body
    class="bg-[#fef7ff] min-h-screen flex items-center justify-center px-6"
  >
    <div class="w-full max-w-md">
      <!-- Logo -->

      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-purple-700">RiwiFlow</h1>

        <p class="text-gray-500 mt-2">
          Sign in to your professional workspace
        </p>
      </div>

      <!-- Card -->

      <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <form class="space-y-6" id="loginForm">
          <!-- Email -->

          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700">
              Email address
            </label>

            <input
              id="email"
              type="email"
              placeholder="name@company.com"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus-ring"
              required
            />
          </div>

          <!-- Password -->

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700">
                Password
              </label>

              <a
                href="#"
                class="text-sm text-purple-700 hover:underline"
              >
                Forgot password?
              </a>
            </div>

            <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus-ring"
              required
            />
          </div>

          <!-- Error Message -->

          <p
            id="errorMessage"
            class="hidden text-red-500 text-sm font-medium"
          >
            Invalid email or password
          </p>

          <!-- Button -->

          <button
            type="submit"
            class="w-full bg-purple-700 hover:bg-purple-800 text-white py-3 rounded-lg font-medium transition-all"
          >
            Login
          </button>
        </form>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const errorMessage = document.getElementById("errorMessage");

        try {
          const response = await fetch(
            `http://localhost:3000/users?email=${email}&password=${password}`
          );

          const users = await response.json();

          if (users.length > 0) {
            const user = users[0];

            // Save session

            localStorage.setItem("user", JSON.stringify(user));

            // Redirect

            window.location.href = "./board.html";
          } else {
            errorMessage.classList.remove("hidden");
          }
        } catch (error) {
          console.error(error);

          alert("Server error");
        }
      });
    </script>
  </body>
</html>
