<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>RiwiFlow Dashboard</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .task-card:hover {
        transform: translateY(-2px);
        transition: 0.2s;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <script>
      // Route protection

      const user = JSON.parse(localStorage.getItem("user"));

      if (!user) {
        window.location.href = "./login.html";
      }
    </script>

    <!-- Header -->

    <header
      class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between"
    >
      <div>
        <h1 class="text-3xl font-bold text-purple-700">RiwiFlow</h1>

        <p class="text-gray-500 text-sm mt-1">
          Welcome,
          <span id="userName"></span>
          (
          <span id="userRole"></span>
          )
        </p>
      </div>

      <div class="flex items-center gap-3">
        <button
          id="createTaskBtn"
          class="hidden bg-purple-700 hover:bg-purple-800 text-white px-5 py-2 rounded-lg"
        >
          New Task
        </button>

        <button
          id="logoutBtn"
          class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg"
        >
          Logout
        </button>
      </div>
    </header>

    <!-- Kanban -->

    <main class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- TODO -->

        <div class="bg-gray-200 rounded-2xl p-4">
          <h2 class="font-bold text-lg mb-4">Todo</h2>

          <div id="todo" class="space-y-4"></div>
        </div>

        <!-- IN PROGRESS -->

        <div class="bg-gray-200 rounded-2xl p-4">
          <h2 class="font-bold text-lg mb-4">In Progress</h2>

          <div id="in-progress" class="space-y-4"></div>
        </div>

        <!-- IN REVIEW -->

        <div class="bg-gray-200 rounded-2xl p-4">
          <h2 class="font-bold text-lg mb-4">In Review</h2>

          <div id="in-review" class="space-y-4"></div>
        </div>

        <!-- DONE -->

        <div class="bg-gray-200 rounded-2xl p-4">
          <h2 class="font-bold text-lg mb-4">Done</h2>

          <div id="done" class="space-y-4"></div>
        </div>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
